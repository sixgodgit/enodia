# 每个 PR、每次推到 main：Swift 实时核心（Linux）+ Python NDW 中继。
# iOS 层（ios/，高德与 CarPlay）需要 Xcode 与 iOS SDK，不在这里编译。

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: NavCore / NavServices (Swift 6.1, Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Strict concurrency, warnings as errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  relay:
    name: NDW relay (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest relay/tests -q -p no:cacheprovider
